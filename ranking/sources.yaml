# Source registry for the Riyadh restaurant ranking.
#
# How weights are chosen for a mention (see ranking/scoring.py):
#   1. The extract's `publisher` is matched against `publishers[*].match` (case- and
#      punctuation-insensitive substring match). The first publisher that matches wins.
#   2. If that publisher lists a scheme for the extract's `source_type` under `schemes`,
#      that scheme is used; otherwise the `type_defaults` scheme for the source_type is used.
#      Unknown publishers therefore fall back to type defaults automatically.
#   3. The scheme turns the parsed tier ("1 star", "#12", "winner",
#      "recommended by 4 commenters", ...) into a base weight.
# Then: score = sum(base x recency), one mention per source (its max tier), and all lists of
# the same publisher together contribute at most `publisher_cap` x their best single mention.
#
# Monthly session: add every NEW publisher you meet here (id, name, match, type, urls,
# language, notes). Keep ids stable; never delete a publisher that was used in past months.

recency:            # months between published_at and the build month -> multiplier
  - {max_months: 12, multiplier: 1.0}
  - {max_months: 24, multiplier: 0.7}
  - {max_months: 36, multiplier: 0.4}
  - {max_months: null, multiplier: 0.2}
undated_multiplier: 0.8
publisher_cap: 1.5

schemes:
  michelin:
    stars: {3: 14, 2: 12, 1: 10}
    bib: 7
    listed: 5            # "Selected" / "Recommended" / "listed"
    green_star_bonus: 1
  gault_millau:
    toques: {5: 8, 4: 8, 3: 7, 2: 6, 1: 5}
    listed: 4
  la_liste:
    flat: 5              # any La Liste listing
  fifty_best:
    rank_brackets: [{max: 10, weight: 9}, {max: 50, weight: 8}, {max: 100, weight: 5}]
    rank_beyond: 5
    special: 6           # special awards (e.g. "Best Restaurant in Saudi Arabia")
    winner: 6
    listed: 5
  award:
    winner: 6
    finalist: 3          # finalist / nominee / shortlisted / highly commended
    special: 6
    listed: 3
  editorial:
    rank_brackets: [{max: 3, weight: 4}]
    rank_beyond: 3
    listed: 3
  official:
    flat: 2
  community:
    recommended_brackets: [{min: 5, weight: 2}, {min: 2, weight: 1.5}, {min: 1, weight: 1}]
    creator: 1.5         # tier "creator top list" (a blogger's / channel's own top list)
    listed: 1
  creator:
    flat: 1.5            # a YouTube / TikTok / blog creator's own top list
  guide:                 # generic guide by an unknown publisher
    stars: {3: 14, 2: 12, 1: 10}
    toques: {5: 8, 4: 8, 3: 7, 2: 6, 1: 5}
    bib: 7
    listed: 4

type_defaults:
  guide: guide
  ranking: fifty_best
  award: award
  editorial: editorial
  official: official
  community: community

publishers:
  # ---- guides & rankings
  - id: michelin
    name: MICHELIN Guide
    award_label: MICHELIN
    match: [michelin]
    type: guide
    schemes: {guide: michelin, award: michelin, ranking: michelin, editorial: michelin}
    language: en
    urls: [https://guide.michelin.com/sa/en/riyadh-province/riyadh/restaurants]
    notes: First Riyadh/KSA selection expected 2026; Stars, Bib Gourmand, Selected, Green Star.
  - id: mena50best
    name: MENA's 50 Best Restaurants
    award_label: MENA's 50 Best
    match: ["50 best", "fifty best", "50best", "worlds 50 best"]
    type: ranking
    schemes: {ranking: fifty_best, award: fifty_best, guide: fifty_best, editorial: fifty_best}
    language: en
    urls: [https://www.theworlds50best.com/mena/en/list/1-50]
    notes: Annual list 1-50 (plus 51-100 extended list); special awards.
  - id: gaultmillau
    name: Gault&Millau
    award_label: Gault&Millau
    match: ["gault", "millau"]
    type: guide
    schemes: {guide: gault_millau, award: award, ranking: gault_millau, editorial: gault_millau}
    language: en
