# Places kept OUT of the restaurants ranking (read by ranking/exclusions.py).
#
# Rule: a place is excluded when it is a cafe / coffee shop / roastery / bakery / tea house /
# juice bar / dessert-only shop, judged from its name and from how the sources describe it.
# Cafe-restaurants with a full food menu (Urth Caffé, Em Sherif Café, Café Boulud, tashas,
# NOOA, Angelina, ...) are restaurants and STAY; list them under `_keep` once reviewed so
# `python -m ranking qa` stops flagging them.
#
# Format: brand name -> reason. Matching uses the same normalised keys as aliases.yaml, so
# any spelling that aliases.yaml maps to the brand is excluded too. Excluded places are kept
# in data/rankings/restaurants/<month>.json under `excluded` (for a future cafes ranking) and
# never appear in the restaurants list or on the site.

