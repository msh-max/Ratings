name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: End-to-end smoke test (fake Places client, no API key)
        run: |
          set -euo pipefail
          rm -rf /tmp/ci*.sqlite* /tmp/ci-exports /tmp/ci-summary
          # free mode, Riyadh (the defaults)
          ksa-restaurants --fake --db /tmp/ci.sqlite run --out /tmp/ci-exports --summary-dir /tmp/ci-summary
          ksa-restaurants --fake --db /tmp/ci.sqlite smoke --out /tmp/ci-exports/smoke --summary-dir /tmp/ci-summary/smoke
          # paid mode, country-wide
          ksa-restaurants --fake --db /tmp/ci-paid.sqlite --area saudi --allow-paid run --out /tmp/ci-exports/paid --summary-dir /tmp/ci-summary/paid
